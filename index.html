<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatBot AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --panel:     #16161f;
      --border:    #1e1e2e;
      --accent:    #7c6af7;
      --accent2:   #3ddcf7;
      --user-bg:   #1a1830;
      --bot-bg:    #141420;
      --text:      #e8e8f0;
      --muted:     #5a5a78;
      --positive:  #2ed47a;
      --negative:  #f75e6a;
      --neutral:   #7c6af7;
    }

    html, body, #root { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glowing orbs */
    body::after {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(124,106,247,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: drift 12s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate(0,0); }
      to   { transform: translate(80px, 60px); }
    }

    /* Layout */
    .app {
      position: relative;
      z-index: 1;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 8px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      margin-bottom: 16px;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sidebar-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      padding: 8px 12px 4px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--muted);
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .sidebar-item:hover, .sidebar-item.active {
      background: var(--panel);
      color: var(--text);
      border-color: var(--border);
    }

    .sidebar-item.active { color: var(--accent); }

    .sidebar-icon { font-size: 15px; }

    /* Stats panel at bottom of sidebar */
    .stats-panel {
      margin-top: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .stats-title {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .stat-label { color: var(--muted); }

    .stat-badge {
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-positive { background: rgba(46,212,122,0.15); color: var(--positive); }
    .badge-negative { background: rgba(247,94,106,0.15); color: var(--negative); }
    .badge-neutral  { background: rgba(124,106,247,0.15); color: var(--neutral); }

    /* Main chat area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Top bar */
    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
      background: var(--surface);
      flex-shrink: 0;
    }

    .topbar-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      position: relative;
    }

    .online-dot {
      position: absolute;
      bottom: 1px; right: 1px;
      width: 9px; height: 9px;
      background: var(--positive);
      border-radius: 50%;
      border: 2px solid var(--surface);
    }

    .topbar-info { flex: 1; }

    .topbar-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
    }

    .topbar-status {
      font-size: 11px;
      color: var(--positive);
    }

    .topbar-actions { display: flex; gap: 8px; }

    .icon-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: all 0.2s;
    }

    .icon-btn:hover { color: var(--text); border-color: var(--accent); }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-row {
      display: flex;
      gap: 10px;
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      margin-top: 4px;
    }

    .msg-avatar.bot  { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .msg-avatar.user { background: var(--user-bg); border: 1px solid var(--border); }

    .msg-content { max-width: 65%; display: flex; flex-direction: column; gap: 4px; }
    .msg-row.user .msg-content { align-items: flex-end; }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      position: relative;
    }

    .msg-bubble.bot {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    .msg-bubble.user {
      background: var(--user-bg);
      border: 1px solid rgba(124,106,247,0.3);
      border-top-right-radius: 4px;
      color: #c8c4ff;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: var(--muted);
      padding: 0 4px;
    }

    .sentiment-tag {
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
    }

    /* Typing indicator */
    .typing-bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-top-left-radius: 4px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%            { opacity: 1;   transform: scale(1); }
    }

    /* Input area */
    .input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-box:focus-within { border-color: var(--accent); }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      resize: none;
      min-height: 24px;
      max-height: 120px;
      line-height: 1.5;
    }

    .input-box textarea::placeholder { color: var(--muted); }

    .send-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }

    .send-btn:hover { opacity: 0.85; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .input-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      text-align: center;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--muted);
    }

    .empty-icon {
      width: 64px; height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(124,106,247,0.2), rgba(61,220,247,0.2));
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }

    .empty-title {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .empty-sub { font-size: 13px; text-align: center; max-width: 300px; line-height: 1.6; }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--panel);
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Mono', monospace;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--text);
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const API_URL = "http://127.0.0.1:8000";

const SUGGESTIONS = [
  "Hello! How are you?",
  "What can you help me with?",
  "Tell me something interesting",
  "How does this chatbot work?",
];

const BOT_RESPONSES = [
  "I'm processing your message through the pipeline — Kafka ingested it and Spark is analyzing sentiment!",
  "Great question! I'm connected to a real-time data pipeline using FastAPI, Kafka, and PySpark.",
  "Your message has been logged to PostgreSQL with sentiment analysis attached.",
  "I can see your sentiment is being tracked in real-time via Spark Streaming!",
  "The system is working perfectly — your messages flow from here through Kafka to Spark.",
];

function getSentimentStyle(sentiment) {
  if (!sentiment) return {};
  const s = sentiment.toLowerCase();
  if (s === 'positive') return { background: 'rgba(46,212,122,0.15)', color: '#2ed47a' };
  if (s === 'negative') return { background: 'rgba(247,94,106,0.15)', color: '#f75e6a' };
  return { background: 'rgba(124,106,247,0.15)', color: '#7c6af7' };
}

function Message({ msg }) {
  const isUser = msg.role === 'user';
  const style = getSentimentStyle(msg.sentiment);
  return (
    <div className={`msg-row ${isUser ? 'user' : 'bot'}`}>
      <div className={`msg-avatar ${isUser ? 'user' : 'bot'}`}>
        {isUser ? '👤' : '🤖'}
      </div>
      <div className="msg-content">
        <div className={`msg-bubble ${isUser ? 'user' : 'bot'}`}>
          {msg.text}
        </div>
        <div className="msg-meta">
          <span>{msg.time}</span>
          {msg.sentiment && (
            <span className="sentiment-tag" style={style}>
              {msg.sentiment}
            </span>
          )}
        </div>
      </div>
    </div>
  );
}

function TypingIndicator() {
  return (
    <div className="msg-row bot">
      <div className="msg-avatar bot">🤖</div>
      <div className="typing-bubble">
        <div className="typing-dot" />
        <div className="typing-dot" />
        <div className="typing-dot" />
      </div>
    </div>
  );
}

function App() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const [stats, setStats] = useState({ positive: 0, negative: 0, neutral: 0 });
  const messagesEnd = useRef(null);
  const textareaRef = useRef(null);

  useEffect(() => {
    messagesEnd.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, typing]);

  const now = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  const detectSentiment = (text) => {
    const positive = ['good', 'great', 'love', 'hello', 'hi', 'thanks', 'awesome', 'nice', 'happy', 'wonderful', 'excellent', 'perfect'];
    const negative = ['bad', 'hate', 'terrible', 'awful', 'wrong', 'error', 'broken', 'fail', 'problem', 'issue', 'sad', 'angry'];
    const lower = text.toLowerCase();
    if (positive.some(w => lower.includes(w))) return 'positive';
    if (negative.some(w => lower.includes(w))) return 'negative';
    return 'neutral';
  };

  const sendMessage = async (text) => {
    if (!text.trim()) return;

    const sentiment = detectSentiment(text);
    const userMsg = { id: Date.now(), role: 'user', text, time: now(), sentiment };
    setMessages(prev => [...prev, userMsg]);
    setInput('');
    setStats(prev => ({ ...prev, [sentiment]: prev[sentiment] + 1 }));

    // Reset textarea height
    if (textareaRef.current) textareaRef.current.style.height = 'auto';

    setTyping(true);

    // Try sending to real backend
    try {
      await fetch(`${API_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: 'user1', message: text }),
      });
    } catch (e) {
      // Backend might not be running, that's ok for demo
    }

    // Simulate bot response
    setTimeout(() => {
      setTyping(false);
      const botText = BOT_RESPONSES[Math.floor(Math.random() * BOT_RESPONSES.length)];
      const botMsg = { id: Date.now() + 1, role: 'bot', text: botText, time: now(), sentiment: null };
      setMessages(prev => [...prev, botMsg]);
    }, 1200 + Math.random() * 800);
  };

  const handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input);
    }
  };

  const handleInput = (e) => {
    setInput(e.target.value);
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  };

  const total = stats.positive + stats.negative + stats.neutral;

  return (
    <div className="app">
      {/* Sidebar */}
      <div className="sidebar">
        <div className="logo">
          <div className="logo-icon">⚡</div>
          <span className="logo-text">NeuralChat</span>
        </div>

        <div className="sidebar-label">Navigation</div>
        {[
          { icon: '💬', label: 'Chat', active: true },
          { icon: '📊', label: 'Analytics' },
          { icon: '⚙️', label: 'Settings' },
          { icon: '📡', label: 'Pipeline Status' },
        ].map(item => (
          <div key={item.label} className={`sidebar-item ${item.active ? 'active' : ''}`}>
            <span className="sidebar-icon">{item.icon}</span>
            {item.label}
          </div>
        ))}

        <div className="stats-panel">
          <div className="stats-title">Sentiment Stats</div>
          <div className="stat-row">
            <span className="stat-label">Positive</span>
            <span className="stat-badge badge-positive">+{stats.positive}</span>
          </div>
          <div className="stat-row">
            <span className="stat-label">Negative</span>
            <span className="stat-badge badge-negative">−{stats.negative}</span>
          </div>
          <div className="stat-row">
            <span className="stat-label">Neutral</span>
            <span className="stat-badge badge-neutral">~{stats.neutral}</span>
          </div>
          <div className="stat-row" style={{ marginTop: 8, paddingTop: 8, borderTop: '1px solid var(--border)' }}>
            <span className="stat-label">Total Messages</span>
            <span style={{ fontSize: 12, color: 'var(--text)' }}>{total}</span>
          </div>
        </div>
      </div>

      {/* Chat */}
      <div className="chat-area">
        <div className="topbar">
          <div className="topbar-avatar">
            🤖
            <div className="online-dot" />
          </div>
          <div className="topbar-info">
            <div className="topbar-name">AI Assistant</div>
            <div className="topbar-status">● Online · Kafka connected</div>
          </div>
          <div className="topbar-actions">
            <button className="icon-btn" title="Clear chat" onClick={() => setMessages([])}>🗑</button>
            <button className="icon-btn" title="Info">ℹ</button>
          </div>
        </div>

        <div className="messages">
          {messages.length === 0 ? (
            <div className="empty-state">
              <div className="empty-icon">⚡</div>
              <div className="empty-title">Start a conversation</div>
              <div className="empty-sub">Messages flow through Kafka → Spark → PostgreSQL in real time</div>
              <div className="suggestion-chips">
                {SUGGESTIONS.map(s => (
                  <div key={s} className="chip" onClick={() => sendMessage(s)}>{s}</div>
                ))}
              </div>
            </div>
          ) : (
            messages.map(msg => <Message key={msg.id} msg={msg} />)
          )}
          {typing && <TypingIndicator />}
          <div ref={messagesEnd} />
        </div>

        <div className="input-area">
          <div className="input-box">
            <textarea
              ref={textareaRef}
              rows={1}
              placeholder="Type a message... (Enter to send)"
              value={input}
              onChange={handleInput}
              onKeyDown={handleKey}
            />
            <button className="send-btn" onClick={() => sendMessage(input)} disabled={!input.trim()}>
              ➤
            </button>
          </div>
          <div className="input-hint">Shift+Enter for new line · Sentiment is detected automatically</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
